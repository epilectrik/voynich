correlation:

  escape_permission_transfer:
    direction: "Higher AZC escape permission yields higher B escape incidence"
    categorical: true
    parametric: false
    provenance: "C468"

  vocabulary_restriction_transfer:
    status: "SUSPENDED v7.25 — rests only on C470, demoted to Tier 3 (frequency carryover, not transfer); historical"
    direction: "Restricted MIDDLEs remain restricted in B"
    categorical: true
    parametric: false
    provenance: "C470"  # demoted to Tier 3

  categorical_resolution:
    effect: "Fine distinctions encoded in which tokens are legal"
    frequency_dimension: "Section differentiation also manifests as frequency variation of shared PP vocabulary (74% of section JS divergence from PP frequency modulation, C1134)"
    provenance: "C469, C1134"

  category_escape_mechanism:
    status: "SUSPENDED v7.25 — rests only on C1274, demoted to Tier 3 (circular: category labels are defined by atoms that also define qo-escape); historical"
    statement: "Category composition of AZC-shared vocabulary predicts B escape dynamics"
    thermal_effect: "THERMAL rho=+0.780 (p<0.001) -- high THERMAL = high escape"
    transition_effect: "TRANSITION rho=-0.598 (p<0.001) -- high TRANSITION = low escape"
    containment_effect: "CONTAINMENT rho=-0.399 (p<0.001) -- anti-escape"
    marking_effect: "MARKING rho=-0.349 (p=0.001) -- anti-escape"
    n_folios: 82
    bonferroni_survivors: "4/8 categories"
    provenance: "C1274"  # demoted to Tier 3 (circular)

  thermal_escape_mediation:
    statement: "THERMAL escape is fully PREFIX-mediated: THERMAL MIDDLEs -> qo-PREFIX (44.1%) -> QO lane (zero hazard) -> escape"  # 'zero hazard' refers to the hazard-class layer, withdrawn (STATUS_BRIEF §3); the mediation measurement (C1277) is live
    thermal_qo_rate: "44.1% (vs 9.5% baseline)"
    partial_after_qo_control: "rho=-0.081 (p=0.468) -- mediation complete"
    provenance: "C1277"

  transition_anti_escape:
    statement: "TRANSITION anti-escape via role redirection: successors routed to AUX (1.24x) and FQ (1.13x), away from EN (0.85x). PREFIX-independent (partial=-0.586 survives), NOT hazard-mediated (24.2%), NOT sequential (no clustering)."
    mechanism: "Role redirection -- TRANSITION MIDDLEs produce AUX/FQ successors that lack escape capacity"
    en_en_selfloop: "Rejected (0.474 vs 0.517 baseline, suppressed not enriched)"
    per_token: "Each TRANSITION token independently redirects; no sequential persistence"
    asymmetry: "Escape = PREFIX routing (THERMAL->qo), anti-escape = role redirection (TRANSITION->AUX/FQ)"
    provenance: "C1285, C1281"

  hazard_category_concentration:
    status_note: "Construct withdrawn — historical. 'Hazard' here is membership in the forbidden-transition hazard classes, which STATUS_BRIEF §3 withdraws (class level demoted C783; taxonomy imposed C2060; token zeros reduce C2081). C1280 itself is still Tier 2 in the generated table; the mismatch is flagged to the maintainer, and this entry is not presented as structure."
    statement: "Hazard concentrates in FLOW (50.4%) and CONTAINMENT (11.5%). THERMAL is hazard-immune (2.6%)."
    cramers_v: "0.560"
    provenance: "C1280"

  vanishing_semantics:
    statement: "Illegality manifests as absence, not marking"
    provenance: "C444, C468"

  vocabulary_scope:
    statement: "B vocabulary is restricted to A-record MIDDLEs only"
    expansion: false  # AZC does NOT expand vocabulary beyond A specification
    filtering_magnitude: "~80% of B vocabulary filtered per A context"
    effect: "Different A records make different B folios viable"
    dual_channel: |
      A-derived MIDDLEs feed B through two distinct channels:
      - Grammar channel: 89 PP MIDDLEs (85 bridge + 4 non-bridge matched) enter
        B's 49-class grammar as classified vocabulary
      - Identification channel: 300 dark-pipeline PP MIDDLEs produce exclusively
        HT/UN tokens (1,696 tokens, 0 grammar tokens), built from bridge atoms
      Per C1140 four-way partition: 85 bridge + 4 matched + 300 dark pipeline + 15 phantom = 404 PP total.
      Channels are anti-correlated at folio level (r=-0.865, C1146): folios
      invest more in grammar execution OR identification, not both equally.
    identification_channel_modulation: "Dark-pipeline MIDDLEs are 3.9x more section-differentiated than PP baseline (JS=0.483 vs 0.124); primary vehicle for section-level vocabulary modulation (C1148)"
    provenance: "C481, C502, C1137, C1140, C1146, C1148"  # C481 retracted 2026-05-19 (survivor sets are not unique); the rest are live

