meta:
  name: "AZC-B Vocabulary Correlation Contract"
  acronym: "AZC-B-ACT"
  version: "1.5"
  date: "2026-02-24"
  status: "ACTIVE"
  layer_type: "correlation contract"
  derived_from: "Tier-2 constraints only"
  audit_note: "v1.5: TRANSITION anti-escape mechanism solved (C1285, Phase 455). Role redirection to AUX/FQ, NOT EN self-loop. Category transition grammar structured (C1286, chi2=526). THERMAL/TRANSITION predict AXM dwell (C1289, rho=+/-0.52). v1.4: THERMAL escape mechanism solved (C1277). v1.3: Category-escape correlation (C1274; since demoted to Tier 3 as circular, PHASE_745). v1.2: Pipeline framing removed."
  registry_alignment: "2026-09-28 — aligned to context/SYSTEM/STATUS_BRIEF.md v7.25. Some cited constraints are now Tier 3 or retracted; each such passage is marked WITHDRAWN or SUSPENDED in place (see header note)."
  headline_status: "Restated 2026-09-28 (STATUS_BRIEF v7.25 alignment). The contract previously headlined three effects of AZC on B: a legality correlation, an intervention-permission envelope, and vocabulary restriction inheritance. The third rests on C470, demoted to Tier 3 (frequency carryover: rare MIDDLEs are rare everywhere), so it is no longer part of the headline. Live headline: vocabulary classified at high-escape AZC positions shows high escape rates in B, both determined by vocabulary properties (C468), with position-indexed escape rates in AZC (C443) and resolution by vocabulary availability rather than parameters (C469)."
  governance: |
    AZC-B-ACT is NOT authoritative. Constraints are authoritative.
    AZC-B-ACT describes HOW vocabulary classified in AZC co-varies with B behavior.
    Do not edit without updating source constraints first.

# ============================================================
scope:
  function: "How vocabulary classified in AZC co-varies with Currier B escape behavior (C468, C469)"
  function_previous: "How AZC legality states constrain Currier B execution"  # restated 2026-09-28: the old headline included restriction inheritance (C470, demoted to Tier 3); see meta.headline_status
  direction: "AZC -> B (vocabulary-mediated correlation, not reverse)"
  b_grammar_authority: false  # Does not modify B grammar
  a_visibility: false  # B does not see A entries
  azc_visibility: false  # B does not see AZC internal structure

# Explicit ownership declaration (prevents misreading)
ownership:
  azc_b_act_owns:
    - nothing
  azc_b_act_describes:
    - legality_correlation
    - intervention_permission_envelope
    - vocabulary_restriction_inheritance  # SUSPENDED: rests on C470, demoted to Tier 3 (frequency carryover); historical

# What B receives (effects, not signals)
b_reception:
  receives:
    - description: "Grammar paths silently constrained by legality"
    - description: "Intervention permission envelope"
    - description: "Vocabulary restriction inheritance"
      status: "SUSPENDED v7.25 — rests on C470, demoted to Tier 3 (frequency carryover); historical"
  does_not_receive:
    - "Currier A entry identity"
    - "AZC internal structure"
    - "Why tokens are legal/illegal"
    - "Compatibility graph mechanics"
    - "Positional semantics (C, P, R, S zones)"

guarantees:
  - id: "LEGALITY_CORRELATION"
    statement: "Vocabulary classified at high-escape AZC positions produces high escape rates in B (28x difference); both determined by vocabulary properties"
    provenance: "C468"

  - id: "RESTRICTION_PRESERVATION"
    status: "SUSPENDED v7.25 — rests only on C470, demoted to Tier 3 (PHASE_748: frequency carryover — after frequency control the AZC-to-B restriction link falls to partial rho 0.062); historical, see C470 in context/CLAIMS/azc_system.md"
    statement: "MIDDLE restrictions transfer intact to B"
    provenance: "C470"  # demoted to Tier 3

  - id: "GRAMMAR_INDEPENDENCE"
    statement: "B grammar is unchanged by AZC legality"
    provenance: "C121, C124"

  - id: "BLIND_EXECUTION"
    statement: "B executes without knowledge of upstream mechanics"
    provenance: "C384, C468"

  - id: "CATEGORICAL_RESOLUTION"
    statement: "Resolution via vocabulary availability, not parameters"
    provenance: "C469"

  - id: "CATEGORY_ESCAPE_CORRELATION"
    status: "SUSPENDED v7.25 — rests only on C1274, demoted to Tier 3 (PHASE_745/C2069: circular — THERMAL is defined by k/e atoms and qo-escape is the k channel, so the correlation measures k-atom density twice); historical"
    statement: "Operational category composition of AZC-shared vocabulary predicts B escape rate: THERMAL (rho=+0.780) high escape, TRANSITION (rho=-0.598) low escape, across 82 B folios"
    provenance: "C1274"  # demoted to Tier 3 (circular)

