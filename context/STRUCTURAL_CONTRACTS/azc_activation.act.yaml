# ============================================================

meta:
  name: "AZC Positional Classification Contract"
  acronym: "AZC-ACT"
  version: "1.5"
  date: "2026-03-06"
  status: "ACTIVE"
  layer_type: "mapping contract"
  derived_from: "Tier-2 constraints only"
  audit_note: "v1.5: o-HEAD cross-system gradient A>AZC>B added (C1559, Phase 548). v1.4: Zone HEAD atomization added (C1516-C1522, Phase 541). Zones differentiate at HEAD slot level (V=0.115) despite raw atom uniformity (C1271). o-HEAD zone-graded. B/A proximity partition. v1.3: Category organization added (C1269-C1276, Phase 453). v1.2: Pipeline framing removed per AZC_POSITION_VOCABULARY (2026-01-31)."
  governance: |
    AZC-ACT is NOT authoritative. Constraints are authoritative.
    AZC-ACT describes HOW vocabulary is positionally classified in AZC.
    Do not edit without updating source constraints first.

# ============================================================
scope:
  function: "How vocabulary shared between A and AZC is positionally classified"
  direction: "A -> AZC (one-way transformation, not reverse)"
  vocabulary_authority: false  # AZC does not "own" vocabulary
  generativity: false  # No derivation rules
  b_semantics: false  # Execution is downstream, not here

# Explicit ownership declaration (prevents misreading)
ownership:
  azc_owns:
    - nothing
  azc_encodes:
    - positional_classification
    - vocabulary_grouping
    - compatibility_signature

guarantees:
  - id: "VOCABULARY_ACTIVATED"
    statement: "AZC constraint activation is vocabulary-driven"
    provenance: "C441"

  - id: "COMPATIBILITY_GROUPING"
    statement: "AZC folios group vocabulary by compatibility signature"
    provenance: "C442"

  - id: "LEGALITY_CORRELATION"
    statement: "AZC positional vocabulary profiles correlate reliably with B behavior (28x escape rate difference)"
    provenance: "C468"

  - id: "NO_CONTENT_MUTATION"
    statement: "AZC does not mutate A entry contents"
    provenance: "C444"

  - id: "FAMILY_AGNOSTIC_MECHANISM"
    statement: "AZC legality mechanism is family-agnostic"
    provenance: "C430-C436, C441-C443"

  - id: "ZONE_CATEGORY_SPECIALIZATION"
    statement: "AZC zones (R, C, S, P) have statistically distinct operational category profiles (V=0.084, p=0.000180)"
    provenance: "C1269"

  - id: "FAMILY_CATEGORY_DIVERGENCE"
    statement: "Zodiac and A/C families have distinct category profiles (V=0.122, p=0.000001) despite family-agnostic mechanism"
    provenance: "C1270"

  - id: "BRIDGE_DARK_ZONE_SORTING"
    statement: "AZC zones mediate bridge/dark category sorting; bridge sorted by category within zones (p=0.0003), dark not (p=0.198)"
    provenance: "C1272"

  - id: "EXCLUSIVE_VOCABULARY_SPECIALIZED"
    statement: "356 AZC-exclusive MIDDLEs are MARKING/THERMAL enriched, TRANSITION-depleted (V=0.382 vs bridge)"
    provenance: "C1273"

  - id: "HEAD_DOMAIN_DIFFERENTIATION"
    statement: "AZC zones differentiate at HEAD domain level (chi2=112.3, V=0.115, p=5.81e-17) despite sharing raw atom proportions (C1271). o-HEAD is zone-graded (R=17.7% to S=29.3%). HEAD is 5.2x more discriminating than TERMINAL across zones."
    provenance: "C1516, C1517, C1518"

  - id: "ZONE_SYSTEM_PROXIMITY_PARTITION"
    statement: "AZC zones partition into B-proximate (R, P: lower o-HEAD, more bridge) and A-proximate (C, S, L: higher o-HEAD, more dark/exclusive) by HEAD JSD"
    provenance: "C1522"

# ============================================================
invariants:
  monotonicity:
    statement: "Survivor options never increase from earlier to later positions"
    provenance: "C443, C444"

  position_independence:
    statement: "The SAME A-type can appear in any position; position determines legality, not content"
    provenance: "C444"

  vocabulary_mediation:
    statement: "All A->B relationships are vocabulary-mediated, not addressable"
    provenance: "C384, C441"

  scaffold_independence:
    statement: "Legality zones are independent of scaffold presentation"
    provenance: "C430-C436"

  zone_atom_uniformity:
    statement: "AZC zones share the same raw atom-level (character) proportions (C1271) but differentiate at HEAD slot level (V=0.115, C1516). Uniformity is in character inventory; differentiation is in how atoms are deployed across functional slots."
    provenance: "C1271, C1516"

  no_spatial_coherence:
    statement: "Category assignment is spatially random within zones; organization is zone-grain not line-grain"
    provenance: "C1275"

  pharma_atom_convergence:
    statement: "All AZC sections converge on Currier A Pharma section atom profile (r>0.916)"
    provenance: "C1276"

# ============================================================
category_organization:
  provenance: "C1269-C1276"

  zone_category_profiles:
    statement: "Zones specialize by operational category (chi2=52.18, V=0.084, p=0.000180)"
    R: "TRANSITION/FLOW-heavy"
    C: "TRANSITION/OPERATION-enriched"
    P: "TRANSITION/STAGING-heavy"
    S: "TRANSITION/FLOW/OPERATION"
    provenance: "C1269"

  family_category_profiles:
    statement: "Zodiac vs A/C families differ in category content despite identical mechanism"
    zodiac: "TRANSITION/FLOW/THERMAL-enriched"
    ac: "TRANSITION/STAGING/OPERATION-enriched"
    provenance: "C1270"

  sorting_mechanism:
    statement: "AZC zones mediate bridge/dark category sorting"
    bridge: "Category-zone coupled (p=0.0003), R-dominated (47.5%)"
    dark: "Category-zone uncoupled (p=0.198), S-shifted (26.9%)"
    implication: "AZC positional structure sorts bridge vocabulary by category for B grammar channel"
    provenance: "C1272"

  exclusive_vocabulary:
    statement: "356 AZC-exclusive MIDDLEs form categorically specialized population"
    profile: "MARKING 27.2%, THERMAL 27.0%, TRANSITION 6.5%"
    divergence: "V=0.382 vs bridge, V=0.210 vs dark"
    provenance: "C1273"

  atom_level:
    zone_uniformity: "Zones do NOT differentiate at raw atom level (0/8 AXIS at Bonferroni, C1271)"
    head_slot_differentiation: "Zones DO differentiate at HEAD slot level (chi2=112.3, V=0.115, C1516)"
    resolution: "Raw character proportions uniform; HEAD domain selection zone-graded"
    section_convergence: "All AZC sections converge on A Pharma atom profile (r>0.916)"
    grain: "Category structure is MIDDLE-level; atom deployment structure is HEAD-slot-level"
    provenance: "C1271, C1276, C1516, C1517, C1518"

  zone_head_atomization:
    provenance: "C1516-C1522, C1559"
    head_differentiation:
      statement: "HEAD domain profiles vary significantly across zones (V=0.115)"
      o_head_gradient: "R=17.7%, P=19.1%, C=26.2%, S=29.3%, L=30.9% (overall 1.90x B)"
      cross_system_gradient: "A(28.5%) > AZC(22.4%) > B(11.8%), A/B=2.42x (C1559)"
      head_vs_terminal: "HEAD JSD 5.2x TERMINAL JSD -- zones select WHAT domain, not HOW to close"
      provenance: "C1516, C1517, C1518"
    family_head_diversity:
      statement: "Zodiac internally uniform, A/C 2.0x more diverse at HEAD level"
      between_family: "JSD=0.0158 (similar overall)"
      provenance: "C1519"
    r_series_null:
      statement: "R-series subscripts show NO HEAD gradient (all p=0.600)"
      provenance: "C1520"
    pipeline_by_zone:
      statement: "Zone pipeline composition varies; dark MIDDLEs 1.84x o-HEAD vs bridge"
      s_zone: "Most dark/exclusive (16.8%/21.4%)"
      p_zone: "Most bridge-dominated (80.4%)"
      provenance: "C1521"
    system_proximity:
      statement: "Zones partition into B-proximate (R, P) and A-proximate (C, S, L)"
      b_proximate: "Lower o-HEAD, higher bridge rate"
      a_proximate: "Higher o-HEAD, more dark/exclusive"
      provenance: "C1522"

# ============================================================
inputs:
  accepted:
    type: "registry_entry"
    from_casc: "record_types.registry_entry"
    minimum_tokens: 2
    provenance: "C482, C484"

  excluded:
    type: "control_operator"
    reason: "Control operators are meta-structural, not registry content"
    provenance: "C484"

# ============================================================

positional_zones:
  provenance: "C306, C313"

  zones:
    C:
      function: "Interior placement, rotation-tolerant"
      escape_permission: "moderate"
      provenance: "C306, C317"


    R_series:
      members: ["R1", "R2", "R3"]
      ordering: "strictly forward (R1->R2->R3 only)"
      backward_transitions: "FORBIDDEN"
      skip_transitions: "FORBIDDEN"
      function: "Ordered interior stages, progressive escape restriction"
      escape_gradient: "decreasing (high to zero)"
      restricted_to_ordered_subscript_family: true
      observed_in: "Zodiac family (C432)"
      provenance: "C432, C434, C443"

    S_series:
      members: ["S0", "S1", "S2"]
      function: "Boundary markers, no intervention permitted"
      escape_permission: "zero"
      ordering: "S2 appears earlier than S1"
      restricted_to_ordered_subscript_family: true
      observed_in: "Zodiac family (C432)"
      provenance: "C320, C432, C435, C443"

  zone_semantics: |
    Diagram positions only: C, R-series, S-series.
    Interior diagram positions (R-series, C) have moderate escape permission.
    Boundary diagram positions (S-series) forbid intervention.
    P (Paragraph) is NOT a diagram position - it is Currier A text on AZC folios.

# ============================================================

transformations:

  compatibility_grouping:
    observation: "Specialized vocabulary appears at distinct positions; combinations that don't occur reflect fixed positional encoding"
    provenance: "C442, C475"

  escape_permission_changes:
    effect: "Same A-type has different intervention permission by position"
    provenance: "C443, C444"

  categorical_resolution:
    effect: "Operational conditions represented categorically"
    provenance: "C469"

  vocabulary_legality:
    expansion: false  # AZC does NOT expand vocabulary beyond A specification
    observation: "Only tokens with matching PREFIX, MIDDLE, and SUFFIX appear in B execution"
    morphological_correspondence:  # C502.a - full morphological correspondence
      middle_only:
        legal_tokens: "257 (5.3%)"
        excluded: "94.7%"
      middle_plus_prefix:
        legal_tokens: "92 (1.9%)"
        additional_reduction: "64%"
      middle_plus_suffix:
        legal_tokens: "130 (2.7%)"
        additional_reduction: "50%"
      full_morphology:
        legal_tokens: "38 (0.8%)"
        additional_reduction: "85% beyond MIDDLE"
    legacy_claim: "Original ~80%/~96 of 480 was MIDDLE-only against token types"
    provenance: "C481, C502, C502.a"

  content_invariants:
    - "No movement of tokens"
    - "No selection"
    - "No branching"
    - "No instruction creation"
    - "No mutation of entry contents"

# ============================================================
persistence:
  a_survivor_independence:
    statement: "A-vocabulary tokens persist independently of AZC legality windows"
    provenance: "C343"

  vanishing_semantics:
    statement: "Position exclusivity, not active filtering"
    provenance: "C444"

  restriction_inheritance:
    statement: "MIDDLE restrictions transfer to B"
    provenance: "C470"

# ============================================================
morphological_binding:

  prefix_affinity:
    provenance: "C471"

  middle_specificity:
    provenance: "C472"

  constraint_bundle:
    statement: "Each A entry functions as a constraint bundle"
    effect: "Determines which AZC legality envelopes apply"
    provenance: "C473"

# ============================================================
negative_guarantees:
  - guarantee: "No token movement"
    reason: "AZC encodes position, does not route"

  - guarantee: "No selection"
    reason: "AZC records vocabulary position; it does not select or route vocabulary"

  - guarantee: "No branching"
    reason: "No conditional paths in AZC structure"

  - guarantee: "No instruction creation"
    reason: "AZC encodes position, B executes"

  - guarantee: "No semantic content"
    reason: "Positions are legality regimes, not meanings"

  - guarantee: "No dynamic AZC decision-making"
    reason: "F-AZC-015 closed this (Case B confirmed)"

# ============================================================

deferred:
  - topic: "Zodiac vs A/C family internal scaffolds"
    reason: "Family-level structure, not A-entry transformation"

  - topic: "Ordered subscript internal semantics (R1-R3, S1-S2)"
    reason: "Zodiac internal organization, not A-entry effects"

  - topic: "Spiral topology"
    reason: "Diagram geometry, outside positional legality"

  - topic: "Diagram physical layout"
    reason: "Geometric structure, not constraint mechanics"

  - topic: "Orientation postures"
    reason: "Physical interpretation, not structural contract"

  - topic: "HT positional asymmetries"
    reason: "HT layer belongs to separate contract (HT-ACT)"

# ============================================================
disallowed:
  - interpretation: "AZC owns vocabulary"
    reason: "Vocabulary is A-derived, AZC constrains positions"
    provenance: "C441, CASC"

  - interpretation: "AZC selects procedures"
    reason: "AZC defines legality, B executes, operator selects"
    provenance: "C473"

  - interpretation: "Position encodes meaning"
    reason: "Position encodes legality constraints, not semantics"
    provenance: "C313"

  - interpretation: "AZC is addressable lookup from A entries to B programs"
    reason: "No entry-level A-B coupling exists (C384); AZC classifies vocabulary, not entries"
    provenance: "C384, C441"

  - interpretation: "AZC decides dynamically"
    reason: "Ambient legality field, not decision engine"
    provenance: "F-AZC-015"

  - interpretation: "AZC expands vocabulary beyond A specification"
    reason: "AZC restricts, does not expand. Only A-record MIDDLEs are legal for B execution."
    provenance: "C481, C502"

  - interpretation: "AZC diagram lines are thematically organized"
    reason: "No within-line category coherence (C1275, p=0.568). Category structure is zone-grain, not line-grain."
    provenance: "C1275"

  - interpretation: "AZC zones differ at raw atom (character frequency) level"
    reason: "0/8 AXIS clusters differentiate zones at Bonferroni (C1271). However, zones DO differ at HEAD slot level (V=0.115, C1516). The distinction: raw character proportions are uniform, but HEAD domain selection is zone-graded."
    provenance: "C1271, C1516"

